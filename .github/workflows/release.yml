name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-sign-upload:
    name: Build, sign, and upload
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Build and sign plugin
        shell: pwsh
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          & ./scripts/Invoke-ReleaseBuild.ps1 -ReleaseLabel '${{ github.event.release.tag_name }}'

      - name: Upload zip to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $version = & ./scripts/Get-PluginVersion.ps1 -Path ./build.gradle.kts
          $zip = Get-ChildItem -LiteralPath ./build/distributions -Filter "*-$version.zip" -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($null -eq $zip) {
            throw "No plugin zip found to upload for version $version"
          }

          Write-Host "Uploading $($zip.Name) to release ${{ github.event.release.tag_name }}"
          gh release upload "${{ github.event.release.tag_name }}" $zip.FullName --clobber
